name: Hello CI

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Show where I am
        run: pwd

      - name: Show repository files
        run: ls -la

      - name: Say hello
        run: echo "Hello from GitHub Actions"
