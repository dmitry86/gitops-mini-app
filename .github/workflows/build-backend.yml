name: Build backend image

on:
  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - ".github/workflows/build-backend.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/dmitry86/gitops-mini-app-backend:latest
            ghcr.io/dmitry86/gitops-mini-app-backend:${{ github.sha }}
