services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    volumes:
      - football-data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U football -d football"]
        interval: 5s
        timeout: 5s
        retries: 10

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql://football:football@postgres:5432/football
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  football-data:
