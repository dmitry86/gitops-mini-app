apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app-backend
spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: mini-app-backend

  template:
    metadata:
      labels:
        app: mini-app-backend

    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U football -d football; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: football-db
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: backend

spec:
  selector:
    app: mini-app-backend

  ports:
    - port: 8000
      targetPort: 8000
