apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: mini-app-frontend
  template:
    metadata:
      labels:
        app: mini-app-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: mini-app-frontend
  ports:
    - port: 80
      targetPort: 80
