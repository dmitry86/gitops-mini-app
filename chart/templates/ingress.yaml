{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: IngressBROKEN
metadata:
  name: mini-app
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
